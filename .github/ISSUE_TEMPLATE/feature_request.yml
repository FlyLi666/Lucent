name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: cost
    attributes:
      label: Resource cost
      description: Lucent tries hard to stay light. Does this need extra sampling, network access or permissions?
